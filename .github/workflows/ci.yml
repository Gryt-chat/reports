name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      # The scripts, the MCP server and the lint config, which the app's tsconfig doesn't reach.
      - run: npx tsc -p scripts

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi
      - run: yarn test

      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - run: yarn test:comment-length
      - run: yarn test:retired-logo

      - run: yarn build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: yarn install --frozen-lockfile
      # `yarn build` runs tsc first, so this covers typechecking too. A dashboard that does
      # not compile leaves the plain pages answering rather than taking the inbox down.
      - run: yarn build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Not pushed. This only answers whether the image still builds, which is
      # the thing that breaks between releases and is not caught by yarn build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
